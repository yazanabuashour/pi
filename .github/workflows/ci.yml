name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install shell checkers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck shfmt jq
      - name: Install shell checkers on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck shfmt jq
      - run: npm ci --ignore-scripts --include=dev --legacy-peer-deps --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
