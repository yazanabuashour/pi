name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install shell checkers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck shfmt jq
      - name: Install shell checkers on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck shfmt jq
      - run: npm ci --ignore-scripts --include=dev --legacy-peer-deps --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - name: Obtain pinned native Pi
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/native-pi-1.0.2"
          mkdir -p "$destination"
          curl --fail --silent --show-error --location \
            https://github.com/earendil-works/pi/releases/download/v1.0.2/pi-linux-x64.tar.gz \
            --output "$destination/pi-linux-x64.tar.gz"
          printf '%s  %s\n' \
            0d7687a6a9fcbaa88ff664cb6b28683ce9ee3e028931b55eb48a70ae9a285d18 \
            "$destination/pi-linux-x64.tar.gz" | sha256sum --check -
          tar -xzf "$destination/pi-linux-x64.tar.gz" -C "$destination"
          test "$("$destination/pi/pi" --version)" = 1.0.2
      - name: Check installed package integration
        id: integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/pi-integration-home"
          npm_cache="$(npm config get cache)"
          HOME="$stage" npm_config_cache="$npm_cache" npm run install:local
          npm ci --prefix runtime-probes/integration-deps \
            --ignore-scripts --omit=dev --legacy-peer-deps --no-audit --no-fund
          npm run test:integration -- "$RUNNER_TEMP/native-pi-1.0.2/pi/pi" \
            "$stage/.local/share/dotfiles-pi-package/current/node_modules/yazan-pi-setup" \
            "$PWD/runtime-probes/integration-deps/node_modules/pi-web-access" \
            "$PWD/runtime-probes/integration-deps/node_modules/agent-browser" \
            "$RUNNER_TEMP/pi-integration-receipts"
      - name: Retain native integration receipts
        if: always() && runner.os == 'Linux' && steps.integration.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-pi-integration
          path: ${{ runner.temp }}/pi-integration-receipts
